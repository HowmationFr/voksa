# Automated dependency updates. Security posture: Chromium fixes reach Voksa
# through Electron patch releases, so the electron entry below is the one that
# matters most; everything else keeps the supply chain current.
#
# Two repo-specific guardrails (see CLAUDE.md):
#   - electron-chrome-extensions is PATCHED via patch-package (synthetic
#     chrome.storage.onChanged, per-tab browser-action state, chrome.* mirrored
#     onto the native `browser` namespace, localized chrome.i18n, no listener
#     cap). Bumping it without re-validating the patch silently breaks
#     extensions like Bitwarden or uBO Lite, so it is never auto-bumped (and
#     pinned exactly in package.json).
#   - Electron MAJOR upgrades are a planned migration (new Chromium major:
#     UA plausibility, extension runtime compat, updater internals), never an
#     automated PR. Patch/minor updates are exactly the security channel and
#     flow through normally.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: electron-chrome-extensions
      # Also PATCHED, for security (exact Chrome Web Store origin, extension
      # ID validation: patches/electron-chrome-web-store+0.13.0.patch) and
      # pinned exactly. A bump must port the patch by hand; the vitest guard
      # (webstorePatch.test.ts) fails if the installed files lose the checks.
      - dependency-name: electron-chrome-web-store
      # MAJORS ARE NOT DEPENDABOT'S. A major version is a migration (Electron
      # 43, React 19, Tailwind 4...): it needs code changes, not a version
      # bump, so a bare bump PR would only sit there red. They are carried
      # out one at a time by the upgrade agent instead (electron-major.yml,
      # dependency-majors.yml, see .github/AUTOMATION.md). Security fixes
      # travel as patch/minor and keep flowing here; a fix that only exists
      # in a new major still raises the CVE alert (alerts are independent of
      # update PRs). This also ends the hydra effect: ignoring one major just
      # makes Dependabot propose the next one down.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One weekly-ish PR for routine bumps; electron stays in its own PR so
      # a security patch is visible (and mergeable) on its own.
      minor-and-patch:
        applies-to: version-updates
        exclude-patterns:
          - electron
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # All CI action bumps ride ONE PR: three separate action PRs are three
      # links of an update-branch cascade under the strict up-to-date rule.
      # It merges on its own, majors included (dependabot-automerge.yml).
      actions:
        patterns:
          - "*"
        # Except the action that runs the upgrade agent: it gets its own pull
        # request, because a major of it waits for a person and must not
        # hold the other actions back.
        exclude-patterns:
          - anthropics/claude-code-action
