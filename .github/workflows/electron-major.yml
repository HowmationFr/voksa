# New Electron major: be told, and get it done.
#
# Dependabot deliberately ignores major versions (see dependabot.yml), so
# nothing used to say when a new Electron major came out. It matters beyond
# convenience: Electron only maintains its most recent stable majors, and a
# major that falls out of that window stops receiving Chromium security fixes.
#
# Once a week:
#   1. `detect` compares the latest stable Electron with the one in
#      package.json. A newer major opens ONE tracking issue (GitHub notifies
#      the maintainer).
#   2. `upgrade` hands the work to agent-upgrade.yml: Electron is bumped on a
#      branch, Claude adapts the code following .github/automation/
#      electron-major-upgrade.md, the checks are re-run, and a pull request is
#      opened that merges on its own once CI is green on all three OSes.
#
# agent-upgrade.yml lists what holds that merge for a person instead (a
# failing check, an agent that is not sure, tests that had to change...).
# Once merged, auto-release.yml ships it like any other dependency update: the
# version only moves by its last number.
#
# Needs two secrets (see .github/AUTOMATION.md): CLAUDE_CODE_OAUTH_TOKEN (the
# agent runs on the maintainer's Claude subscription) and AUTOMATION_TOKEN (a
# pull request opened with the default GITHUB_TOKEN would not trigger CI).
name: Electron major upgrade

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: Electron major to upgrade to (default, the latest stable)
        type: string
        required: false
      retry:
        description: Prepare the upgrade again even if a branch or pull request already exists for it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: electron-major
  cancel-in-progress: false

jobs:
  detect:
    name: Is a newer Electron major out?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      current: ${{ steps.versions.outputs.current }}
      target: ${{ steps.versions.outputs.target }}
      latest: ${{ steps.versions.outputs.latest }}
      branch: ${{ steps.versions.outputs.branch }}
      migrate: ${{ steps.plan.outputs.migrate }}
      issue: ${{ steps.issue.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare the versions
        id: versions
        env:
          WANTED: ${{ inputs.target }}
        run: |
          current="$(node -p "String(require('./package.json').devDependencies.electron).replace(/^[^0-9]*/, '').split('.')[0]")"
          latest="$(npm view electron dist-tags.latest)"
          target="${WANTED:-${latest%%.*}}"
          # Each one on its own: glued together, an empty target next to a
          # valid current major would still read as a number.
          for major in "$current" "$target"; do
            case "$major" in
              ''|*[!0-9]*) echo "::error::Could not read the Electron majors (current='$current', target='$target')."; exit 1 ;;
            esac
          done
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "target=$target"
            echo "branch=automation/electron-$target"
          } >> "$GITHUB_OUTPUT"
          echo "Voksa ships Electron $current; latest stable is $latest; target major is $target." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open the tracking issue (once per major)
        id: issue
        if: fromJSON(steps.versions.outputs.target) > fromJSON(steps.versions.outputs.current)
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          TARGET: ${{ steps.versions.outputs.target }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          title="Electron ${TARGET} is out (Voksa ships ${CURRENT})"
          number="$(gh issue list --state all --search "in:title \"Electron ${TARGET} is out\"" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            {
              echo "@${GITHUB_REPOSITORY_OWNER} Electron **${LATEST}** is the latest stable release; Voksa is on major **${CURRENT}**."
              echo
              echo "Why it matters: Electron only maintains its most recent stable majors ([support policy](https://www.electronjs.org/docs/latest/tutorial/electron-timelines)). Once ${CURRENT} leaves that window it stops receiving Chromium security fixes, and no patch release can bring them."
              echo
              echo "What happens next: \`.github/workflows/electron-major.yml\` has the upgrade prepared on the branch \`automation/electron-${TARGET}\`. The pull request merges on its own once CI is green, unless something calls for a person; either way a comment below says which. Close this issue once Voksa ships Electron ${TARGET}."
              echo
              echo "- [Breaking changes](https://www.electronjs.org/docs/latest/breaking-changes)"
              echo "- [Release notes](https://releases.electronjs.org/release/v${LATEST})"
            } > "$RUNNER_TEMP/issue.md"
            url="$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md")"
            number="${url##*/}"
            echo "Opened issue #$number." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Does the upgrade still have to be prepared?
        id: plan
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          TARGET: ${{ steps.versions.outputs.target }}
          BRANCH: ${{ steps.versions.outputs.branch }}
          RETRY: ${{ inputs.retry }}
        run: |
          migrate=false
          if [ "$TARGET" -gt "$CURRENT" ]; then
            # One attempt per major: a branch or a pull request (open, merged
            # or closed) means it was already prepared, or deliberately
            # declined. `retry` overrides that from the manual trigger.
            attempts="$(gh pr list --head "$BRANCH" --state all --json number --jq length)"
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then attempts=$((attempts + 1)); fi
            if [ "$attempts" -eq 0 ] || [ "$RETRY" = "true" ]; then migrate=true; fi
          fi
          echo "migrate=$migrate" >> "$GITHUB_OUTPUT"
          echo "Prepare the upgrade now: $migrate" | tee -a "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade Electron
    needs: detect
    if: needs.detect.outputs.migrate == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/agent-upgrade.yml
    with:
      package: electron
      from: ${{ needs.detect.outputs.current }}
      to: ${{ needs.detect.outputs.target }}
      branch: ${{ needs.detect.outputs.branch }}
      playbook: .github/automation/electron-major-upgrade.md
      # Scripted, not left to the agent: the same caret range as today, so
      # patch and minor releases of the new major keep flowing through
      # Dependabot afterwards.
      install: npm install --save-dev "electron@^${{ needs.detect.outputs.target }}.0.0"
      issue: ${{ needs.detect.outputs.issue }}
    secrets: inherit
